# Isolated verification profile. replay.mjs replaces ONLY project_id per run.
# Never copy supabase/.temp, env files, or ignored bootstrap SQL into this workdir.
project_id = "sky-erp-replay"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
